services:
  - type: web
    name: farm-api
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn api.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: farm-db
          property: connectionString

databases:
  - name: farm-db
    plan: free
