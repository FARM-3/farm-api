components:
  schemas:
    AccountTypeEnum:
      enum:
      - A
      - L
      - E
      type: string
      description: |-
        * `A` - Asset
        * `L` - Liability
        * `E` - Equity
    Bagging:
      type: object
      description: Serializer for Bagging model (final stage)
      properties:
        id:
          type: integer
          readOnly: true
        processing_id:
          type: string
          description: Unique ID for this bagging batch (e.g., BAG-2024-001)
          maxLength: 50
        name:
          type: string
          description: Descriptive name for this batch
          maxLength: 100
        grade:
          allOf:
          - $ref: '#/components/schemas/GradeEnum'
          description: |-
            Quality grade of the coffee

            * `A` - Grade A
            * `B` - Grade B
            * `C` - Grade C
        moisture_content:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Final moisture content percentage (0-100%)
        date:
          type: string
          format: date
          description: Date when bagging occurred
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Final weight in kg
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date
      - grade
      - id
      - moisture_content
      - name
      - processing_id
      - updated_at
      - weight
    BaggingRequest:
      type: object
      description: Serializer for Bagging model (final stage)
      properties:
        processing_id:
          type: string
          minLength: 1
          description: Unique ID for this bagging batch (e.g., BAG-2024-001)
          maxLength: 50
        name:
