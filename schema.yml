      type: object
      description: |-
        Serializer for Fermenting model
        Includes all fields plus the calculated weight_loss property
      properties:
        id:
          type: integer
          readOnly: true
        processing_id:
          type: string
          description: Unique ID for this fermentation batch (e.g., FERM-2024-001)
          maxLength: 50
        days:
          type: integer
          maximum: 2147483647
          minimum: 1
          description: Number of days for fermentation
        name:
          type: string
          description: Descriptive name for this batch
          maxLength: 100
        grade:
          allOf:
          - $ref: '#/components/schemas/GradeEnum'
          description: |-
            Quality grade of the coffee

            * `A` - Grade A
            * `B` - Grade B
            * `C` - Grade C
        cherry_colour:
          nullable: true
          description: |-
            Cherry colour

            * `red` - Red
            * `green` - Green
            * `Yellow` - yellow
            * `Black` - Black
          oneOf:
          - $ref: '#/components/schemas/FermentingCherryColourEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        date:
          type: string
          format: date
        weight_before:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Weight in kg before fermentation
        weight_after:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Weight in kg after fermentation
        weight_loss:
          type: number
          format: double
          description: Calculate weight loss during fermentation
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - days
      - grade
      - id
      - name
      - processing_id
      - updated_at
      - weight_after
      - weight_before
      - weight_loss
