version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: rugyeyo-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DB_URL=${DB_URL}
    volumes:
      - ./api/staticfiles:/app/staticfiles  # Mount static files for nginx to serve
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - app-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: rugyeyo-postgres
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  # Nginx reverse proxy and static file server
  nginx:
    image: nginx:alpine
    container_name: rugyeyo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./api/staticfiles:/app/staticfiles:ro  # Serve static files
      - ./frontend-web/dist:/app/frontend:ro  # Serve React frontend (if built)
      - ./certbot/conf:/etc/letsencrypt:ro  # SSL certificates (optional)
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
