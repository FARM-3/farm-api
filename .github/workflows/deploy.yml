name: Deploy to Digital Ocean

# Automatically deploy when code is pushed to main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ""
          script: |
            cd /home/rugyeyo/backend
            # Use GitHub token for git authentication (for private repos)
            # Format: https://oauth2:TOKEN@github.com/owner/repo.git
            git remote set-url origin https://oauth2:${{ secrets.GITHUB_TOKEN }}@github.com/Rugyeyo-Farm/api.git
            git pull origin main
            # Stop and remove all containers
            docker-compose -f /home/rugyeyo/docker-compose.yml down --remove-orphans
            # Force remove any stuck containers by name
            docker rm -f rugyeyo-postgres rugyeyo-backend rugyeyo-nginx 2>/dev/null || true
            # Start containers with force recreate
            docker-compose -f /home/rugyeyo/docker-compose.yml up -d --force-recreate
            # Run migrations
            docker-compose -f /home/rugyeyo/docker-compose.yml exec -T backend python manage.py migrate
            # Generate API schema
            docker-compose -f /home/rugyeyo/docker-compose.yml exec -T backend python manage.py spectacular --file schema.yml
